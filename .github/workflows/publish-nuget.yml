name: Publish NuGet package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: nuget-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Graphify.CSharp
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Derive release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" == "$version" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$RELEASE_TAG' is not a supported NuGet semantic version tag (expected vX.Y.Z)." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Restore
        run: dotnet restore Graphify.CSharp.sln

      - name: Restore semantic fixtures
        run: |
          dotnet restore tests/Fixtures/ReferenceFixture/ReferenceFixture.csproj
          dotnet restore tests/Fixtures/CSharp14Fixture/CSharp14Fixture.csproj
          dotnet restore tests/Fixtures/ExtensionBlockFixture/ExtensionBlockFixture.csproj
          dotnet restore tests/Fixtures/LanguageSurfaceFixture/LanguageSurfaceFixture.csproj
          dotnet restore tests/Fixtures/LoaderFixture/LoaderFixture.csproj
          dotnet restore tests/Fixtures/MultiTargetFixture/MultiTargetFixture.csproj
          dotnet restore tests/Fixtures/CSharp15Fixture/CSharp15Fixture.csproj

      - name: Build
        run: dotnet build Graphify.CSharp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Graphify.CSharp.sln --configuration Release --no-build --no-restore

      - name: Build C# 15 fixture
        run: dotnet build tests/Fixtures/CSharp15Fixture/CSharp15Fixture.csproj --configuration Release

      - name: Vulnerability check
        run: dotnet list src/Graphify.CSharp/Graphify.CSharp.csproj package --vulnerable --include-transitive

      - name: Pack tagged version
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: >-
          dotnet pack src/Graphify.CSharp.Cli/Graphify.CSharp.Cli.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts
          -p:Version="$PACKAGE_VERSION"
          -p:PackageVersion="$PACKAGE_VERSION"

      - name: Verify package artifact
        id: package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          package_path="artifacts/Graphify.CSharp.${PACKAGE_VERSION}.nupkg"
          test -f "$package_path"
          echo "path=$package_path" >> "$GITHUB_OUTPUT"
          unzip -l "$package_path"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Graphify.CSharp-${{ steps.version.outputs.value }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

      - name: Install packed .NET 10 tool asset
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/graphify-csharp-tool-net10"
          dotnet tool install \
            --tool-path "$tool_dir" \
            --add-source artifacts \
            --ignore-failed-sources \
            --framework net10.0 \
            Graphify.CSharp \
            --version "$PACKAGE_VERSION"
          "$tool_dir/graphify-csharp" \
            --input tests/Fixtures/ReferenceFixture/ReferenceFixture.csproj \
            --root . \
            --configuration Release \
            --target-framework net10.0 \
            --output "$tool_dir/output.json"

      - name: Install packed .NET 11 tool asset
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/graphify-csharp-tool-net11"
          dotnet tool install \
            --tool-path "$tool_dir" \
            --add-source artifacts \
            --ignore-failed-sources \
            --framework net11.0 \
            Graphify.CSharp \
            --version "$PACKAGE_VERSION"
          "$tool_dir/graphify-csharp" \
            --input tests/Fixtures/CSharp15Fixture/CSharp15Fixture.csproj \
            --root . \
            --configuration Release \
            --target-framework net11.0 \
            --output "$tool_dir/output.json"

      - name: Verify deterministic fixture extraction
        run: ./scripts/check-deterministic-extraction.sh --input tests/Fixtures/ReferenceFixture/ReferenceFixture.csproj --root . --configuration Release

      - name: Validate NuGet Trusted Publishing configuration
        env:
          NUGET_USER: ${{ secrets.NUGET_USER || vars.NUGET_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NUGET_USER" || {
            echo 'NUGET_USER must be configured as a NuGet environment or repository secret/variable.' >&2
            exit 1
          }

      - name: Get NuGet Trusted Publishing credential
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER || vars.NUGET_USER }}

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NUGET_API_KEY" || {
            echo 'NuGet Trusted Publishing did not return a temporary credential.' >&2
            exit 1
          }
          dotnet nuget push "$PACKAGE_PATH" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
